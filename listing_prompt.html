<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Other libraries go here -->

</head>

<body>

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <div class="p-5 container mb-5 border border-secondary">

        <a id="link_placing" target="_blank">Loading Link...</a>

        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <span class="input-group-text" id="inputGroup-sizing-default">Name</span>
            </div>
            <input type="text" class="form-control" id="product_name" aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default">
        </div>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <span class="input-group-text">$</span>
            </div>
            <input type="text" class="form-control" id="product_price" aria-label="Amount (to the nearest dollar)"
                placeholder="Price to nearest dollar">
            <div class="input-group-append">
                <span class="input-group-text">.00</span>
            </div>
        </div>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <span class="input-group-text" id="inputGroup-sizing-default">Seller</span>
            </div>
            <input type="text" class="form-control" id="product_seller" aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default" placeholder="ex. Amazon, Best Buy, etc.">
        </div>
        <div class="alert alert-danger" role="alert">
            Please double check that all information is correct before proceeding
        </div>
        <button type="button" class="btn btn-success" id="listing_prompt_submit">Submit</button>
    </div>

    <div id="navbar-placeholder"></div>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/listing_page.js"></script>
    <script type="module" src="./src/submit_listing.js"></script>
</body>

</html>
