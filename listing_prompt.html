<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Other libraries go here -->

</head>

<body>

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">

    <div class="p-5 container mb-5 border border-secondary">
        <div class="alert alert-info" role="alert">
            <p><strong>It looks like we cant find this product in our data base!</strong></p>
            Please input the following info so we can properly store this site for others refrence.
        </div>
        <div class="mb-3">
            <a id="link_placing" target="_blank" rel="noopener noreferrer">Loading Link...</a>
        </div>

        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <span class="input-group-text" id="inputGroup-sizing-default">Name</span>
            </div>
            <input type="text" class="form-control" id="product_name" aria-label="Product Name"
                aria-describedby="inputGroup-sizing-default" placeholder="Product name from the listing">
        </div>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <span class="input-group-text">$</span>
            </div>
            <input type="text" class="form-control" id="product_price" aria-label="Amount (to the nearest dollar)"
                placeholder="Exact price including cents (e.g. 69.99)">
        </div>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <span class="input-group-text" id="inputGroup-sizing-default">Seller</span>
            </div>
            <input type="text" class="form-control" id="product_seller" aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default" placeholder="Marketplace seller/shipper, not the website (e.g. MAXSUN official)">
        </div>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <span class="input-group-text" id="inputGroup-sizing-default">Product Type</span>
            </div>
            <input type="text" class="form-control" id="product_type" aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default" placeholder="Category from listing (e.g. GPU, Phone, Laptop)">
        </div>
        <div class="alert alert-danger" role="alert">
            Please double check that all information is correct before proceeding
        </div>
        <button type="button" class="btn btn-success" id="listing_prompt_submit">Submit</button>
    </div>

    <div id="navbar-placeholder"></div>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/listing_page.js"></script>
    <script type="module" src="./src/submit_listing.js"></script>
</body>

</html>
