    <!-- Stuff for body goes here -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <div class="container py-4 mb-5">
        <section id="expanded-reviews-page">
            <div id="expanded-reviews-page-header" class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="#" class="btn btn-primary" id="back-in-review">&#8592; Back</a>
                    <h2 class="m-0">User Reviews</h2>
                    <div id="filter-sort">
                        <a href="#" class="btn btn-secondary me-1" id="filterbtn">Filter</a>
                        <a href="#" class="btn btn-secondary" id="sortbtn">Sort</a>
                    </div>
                </div>
            </div>

            <div id="reviews-inner">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <p class="text-muted m-0" id="review-page-post-counter">4 Posts</p>
                    <button class="btn btn-primary" id="to-write-review">Write a review</button>
                </div>
                <div id="reviews-page-container">
                    <!-- reviews go here -->
                </div>
            </div>
        </section>
    </div>

    <section id="sortpage">
        <a href="#" class="btn btn-primary mb-3" id="back-in-sort">&#8592; Back</a>
        <div class="card p-3">
            <h5>Sort Reviews</h5>
            <p class="text-muted">placeholder for sort</p>
        </div>
    </section>
    <section id="filterpage">
        <a href="#" class="btn btn-primary mb-3" id="back-in-filter">&#8592; Back</a>
        <div class="card p-3">
            <h5>Filter Reviews</h5>
            <p class="text-muted">placeholder for filter</p>
        </div>
    </section>
