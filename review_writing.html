<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Other libraries go here -->

</head>

<body>

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <div class="container py-4 mb-5">
        <div class="card mb-4">
            <div class="card-header">
                <b>Write a Review</b>
            </div>
            <div class="card-body">
                <blockquote class="blockquote mb-0">
                    <p id="product_name">Product Name</p>
                    <footer class="blockquote-footer mt-1">*Price*</footer>
                    <a id="link_placing" target="_blank">Loading Link</a>
                </blockquote>
            </div>
        </div>

        <form id="review-form">
            <p class="fw-bold mb-2">Rating</p>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
            <label class="form-check-label" for="inlineRadio1">1</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
            <label class="form-check-label" for="inlineRadio2">2</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3" value="option3">
            <label class="form-check-label" for="inlineRadio3">3</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio4" value="option4">
            <label class="form-check-label" for="inlineRadio4">4</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio5" value="option5">
            <label class="form-check-label" for="inlineRadio5">5</label>
        </div>

        <div class="mb-3">
            <label for="formGroupExampleInput" class="form-label">Review Title</label>
            <input type="text" class="form-control" id="formGroupExampleInput"
                placeholder="Put the title of your review">
        </div>
        <div class="mb-3">
            <label for="formGroupExampleInput2" class="form-label">Review body</label>
            <input type="text" class="form-control" id="formGroupExampleInput2" placeholder="Write your review here">
        </div>

            <button type="button" class="btn btn-primary" onclick="window.location.href='review_page.html';">Post</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='review_page.html'">Cancel</button>
        </form>
    </div>

    <div id="navbar-placeholder"></div>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
    <!-- <script src="./src/listing_page.js"></script> -->
    <script type="module" src="./src/reviewManager.js"></script>

</body>

</html>
