    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <div class="card">
        <div class="card-header">
            <b>Write a Review</b>
        </div>
        <div class="card-body">
            <blockquote class="blockquote mb-0">
                <p id="product_name">Product Name</p>
                <footer class="footer">*Price*</footer>
                <a id="link_placing">Loading Link</a>
            </blockquote>
        </div>
    </div>

    <form>
        <p>Rating</p>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
            <label class="form-check-label" for="inlineRadio1">1</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
            <label class="form-check-label" for="inlineRadio2">2</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3" value="option3">
            <label class="form-check-label" for="inlineRadio3">3</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3" value="option4">
            <label class="form-check-label" for="inlineRadio3">4</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3" value="option5">
            <label class="form-check-label" for="inlineRadio3">5</label>
        </div>

        <div class="form-group">
            <label for="formGroupExampleInput">Review Title</label>
            <input type="text" class="form-control" id="formGroupExampleInput"
                placeholder="Put the title of your review">
        </div>
        <div class="form-group">
            <label for="formGroupExampleInput2">Review body</label>
            <input type="text" class="form-control" id="formGroupExampleInput2" placeholder="Write your review here">
        </div>

        <br><br>
        <button type="button" class="btn btn-primary">Post</button> <button type="button" class="btn btn-secondary"
            onclick="window.location.href='review_page.html'">Cancel</button>

    </form>
