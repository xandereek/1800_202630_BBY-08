<!DOCTYPE html>
<html lang="en">

<head>
    <title>SafeShop - Profile</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <main class="container py-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="home.html" class="btn btn-primary">&#8592; Back</a>
            <h2 class="m-0">Your Profile</h2>
            <div style="width: 70px;"></div>
        </div>

        <!-- Shown when user is signed out -->
        <div id="signed-out-prompt" class="card shadow-sm mx-auto d-none" style="max-width: 540px;">
            <div class="card-body text-center py-4">
                <h5 class="card-title mb-2">You are not signed in</h5>
                <p class="card-text text-muted mb-3">Please log in to view and manage your profile.</p>
                <a href="login.html" class="btn btn-primary">Log In / Sign Up</a>
            </div>
        </div>

        <!-- Shown when user is signed in -->
        <div id="profile-content" class="d-none">
            <div class="card shadow-sm mx-auto" style="max-width: 540px;">
                <div class="card-body p-4">
                    <div class="text-center mb-3">
                        <img id="profileAvatar" src="images/avatar%20placeholder.jpg" alt="Profile picture"
                            class="rounded-circle border d-block mx-auto mb-3"
                            style="width: 110px; height: 110px; object-fit: cover;">
                        <h4 id="profileName" class="card-title mb-1">My Profile</h4>
                        <p id="profileEmail" class="text-muted small mb-0"></p>
                    </div>

                    <hr>

                    <div id="profileAlert" class="alert d-none" role="alert"></div>

                    <form id="profileForm" novalidate>
                        <div class="mb-3">
                            <label for="nameInput" class="form-label"><b>Display Name</b></label>
                            <input type="text" id="nameInput" class="form-control" placeholder="Enter display name"
                                disabled>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" id="editBtn" class="btn btn-secondary">Edit Name</button>
                            <button type="submit" id="saveBtn" class="btn btn-primary" disabled>Save Changes</button>
                        </div>
                    </form>
                </div>

                <div class="card-footer bg-body-tertiary p-3 text-center">
                    <button type="button" id="logoutBtn" class="btn btn-outline-danger w-100">Log Out</button>
                </div>
            </div>
        </div>
    </main>

    <div id="navbar-placeholder"></div>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/profile.js"></script>
</body>

</html>
